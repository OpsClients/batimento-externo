name: alarme da nuvem

# Acionado pelo Worker vigia-nuvem (Cloudflare) quando a VM omidas-vm-1 ou um robo dela entra ou sai de alarme.
# A falha desta rodada e o que manda o e-mail "Run failed" para ia@valeur.com.br (o e-mail de issue nao chega).

on:
  workflow_dispatch:
    inputs:
      estado:
        description: alarme ou recuperado
        required: true
        type: choice
        options: [alarme, recuperado]
      motivo:
        description: resumo sem dados pessoais
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: alarme-da-nuvem
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar alarme ou recuperacao
        id: estado
        uses: actions/github-script@v7
        env:
          ESTADO: ${{ inputs.estado }}
          MOTIVO: ${{ inputs.motivo }}
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const rotulo = 'nuvem-vm';
            const motivo = String(process.env.MOTIVO || 'sem detalhe').replace(/[\r\n]+/g, ' ').slice(0, 500);
            const { data: abertas } = await github.rest.issues.listForRepo({ ...repo, state: 'open', labels: rotulo, per_page: 5 });
            if (process.env.ESTADO === 'alarme') {
              if (!abertas.length) {
                try { await github.rest.issues.createLabel({ ...repo, name: rotulo, color: 'b60205' }); }
                catch (e) { if (e.status !== 422) throw e; }
                await github.rest.issues.create({ ...repo, title: 'OMIDAS na nuvem: alarme na VM', labels: [rotulo],
                  body: `O vigia da Cloudflare encontrou: ${motivo}` });
              } else {
                await github.rest.issues.createComment({ ...repo, issue_number: abertas[0].number, body: `Novo alarme: ${motivo}` });
              }
              core.setOutput('gritar', 'true');
            } else if (process.env.ESTADO === 'recuperado') {
              for (const issue of abertas) {
                await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body: `Resolvido: ${motivo}` });
                await github.rest.issues.update({ ...repo, issue_number: issue.number, state: 'closed' });
              }
            } else throw new Error('estado invalido');

      - name: Avisar por e-mail (falha proposital)
        if: steps.estado.outputs.gritar == 'true'
        env:
          MOTIVO: ${{ inputs.motivo }}
        run: |
          echo "::error title=ALARME NA NUVEM (VM omidas-vm-1)::$MOTIVO"
          exit 1
